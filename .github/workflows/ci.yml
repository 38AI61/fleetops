name: ci

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Put GOPATH bin on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install pinned tools
        run: make tools

      - name: Format check
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Start postgres
        run: |
          PGPW=$(openssl rand -hex 16)
          echo "::add-mask::$PGPW"
          docker run -d --name fleetops-ci-pg \
            -e POSTGRES_USER=fleetops \
            -e POSTGRES_DB=fleetops \
            -e POSTGRES_PASSWORD="$PGPW" \
            -p 127.0.0.1:55432:5432 \
            postgis/postgis:16-3.4
          ready=0
          for _ in $(seq 1 60); do
            if docker exec fleetops-ci-pg pg_isready -h 127.0.0.1 -U fleetops; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then docker logs fleetops-ci-pg; exit 1; fi
          echo "DATABASE_URL=postgres://fleetops:$PGPW@127.0.0.1:55432/fleetops?sslmode=disable" >> "$GITHUB_ENV"

      - name: Migrate up
        run: make migrate

      - name: Migrate down 1
        run: make migrate MIGRATE_ARGS="down 1"

      - name: Migrate up again
        run: make migrate

      - name: Remove postgres container
        if: always()
        run: docker rm -f fleetops-ci-pg

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Put GOPATH bin on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install pinned tools
        run: make tools

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/driver-pwa/package-lock.json
            e2e/package-lock.json

      - name: Install web dependencies
        run: npm --prefix apps/web ci --include=dev

      - name: Install driver PWA dependencies
        run: npm --prefix apps/driver-pwa ci --include=dev

      - name: Install e2e dependencies
        run: npm --prefix e2e ci --include=dev

      - name: Install Chromium
        run: (cd e2e && npx playwright install --with-deps chromium)

      - name: Run happy-path e2e
        run: make e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  image:
    needs: [gates, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build cloud image
        run: docker build -f deploy/cloud/Dockerfile.render -t ghcr.io/38ai61/fleetops:sha-${GITHUB_SHA} -t ghcr.io/38ai61/fleetops:latest .

      - name: Push cloud image
        run: |
          docker push ghcr.io/38ai61/fleetops:sha-${GITHUB_SHA}
          docker push ghcr.io/38ai61/fleetops:latest

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL not set; deploy skipped"
            exit 0
          fi
          curl -fsS -X POST -o /dev/null "$RENDER_DEPLOY_HOOK_URL"
